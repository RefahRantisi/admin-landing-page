<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Portfolio</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f5f6f8;
        color: #1f2937;
      }

      .admin-container {
        max-width: 900px;
        margin: 50px auto;
        padding: 20px;
      }

      .admin-header {
        margin-bottom: 30px;
      }

      .admin-header h1 {
        font-size: 28px;
        margin-bottom: 8px;
      }

      .admin-header p {
        color: #6b7280;
      }

      .admin-actions {
        margin-top: 18px;
      }

      .btn-category {
        display: inline-block;
        padding: 11px 18px;
        background: #111827;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
      }

      .btn-category:hover {
        background: #374151;
      }

      .card {
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }

      .form-group input,
      .form-group textarea,
      .form-group select {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
      }

      .form-group input:focus,
      .form-group textarea:focus,
      .form-group select:focus {
        border-color: #2563eb;
      }

      .form-group textarea {
        min-height: 130px;
        resize: vertical;
      }

      .form-help {
        display: block;
        margin-top: 6px;
        color: #6b7280;
        font-size: 13px;
      }

      .type-options {
        display: grid;
        gap: 10px;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
      }

      .type-option {
        display: flex !important;
        align-items: center;
        gap: 10px;
        margin: 0 !important;
        font-weight: 400 !important;
        cursor: pointer;
      }

      .type-option input {
        width: auto;
        margin: 0;
      }

      .form-actions {
        display: flex;
        gap: 12px;
        margin-top: 30px;
      }

      button {
        border: none;
        border-radius: 8px;
        padding: 12px 20px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }

      .btn-primary {
        background: #2563eb;
        color: white;
      }

      .btn-primary:hover {
        background: #1d4ed8;
      }

      .btn-secondary {
        background: #e5e7eb;
        color: #374151;
      }

      .message {
        display: none;
        padding: 12px 15px;
        border-radius: 8px;
        margin-bottom: 20px;
      }

      .message.success {
        display: block;
        background: #dcfce7;
        color: #166534;
      }

      .message.error {
        display: block;
        background: #fee2e2;
        color: #991b1b;
      }

      @media (max-width: 600px) {
        .admin-container {
          margin: 20px auto;
          padding: 15px;
        }

        .card {
          padding: 20px;
        }

        .form-actions {
          flex-direction: column;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <main class="admin-container">
      <div class="admin-header">
        <h1>Tambah Portfolio</h1>
        <p>Tambahkan project baru ke portfolio website.</p>
      </div>

      <div class="card">
        <form id="portfolioForm">
          <div class="form-group">
            <label for="title">Judul Portfolio *</label>
            <input
              type="text"
              id="title"
              name="title"
              placeholder="Contoh: Website UMKM Snack"
            />
          </div>

          <div class="form-group">
            <label for="slug">Slug *</label>
            <input
              type="text"
              id="slug"
              name="slug"
              placeholder="website-umkm-snack"
            />
            <span class="form-help">
              Digunakan untuk URL portfolio, contoh:
              /portfolio/website-umkm-snack
            </span>
          </div>

          <div class="form-group">
            <label for="category">Kategori *</label>
            <select id="category" name="category_id">
              <option value="">Memuat kategori...</option>
            </select>
            <div class="admin-actions">
              <a href="category.html" class="btn-category">
                + Tambah Kategori
              </a>
            </div>
          </div>

          <div class="form-group">
            <label for="client_name">Nama Client *</label>
            <input
              type="text"
              id="client_name"
              name="client_name"
              placeholder="Contoh: UMKM Snack"
            />
          </div>

          <div class="form-group">
            <label>Jenis Website *</label>
            <div id="typeOptions" class="type-options">
              Memuat jenis website...
            </div>
            <span class="form-help"> Pilih minimal satu jenis website. </span>
            <div class="admin-actions">
              <a href="type.html" class="btn-category">
                + Tambah Jenis Website
              </a>
            </div>
          </div>

          <div class="form-group">
            <label for="image_url">Image URL</label>
            <input
              type="url"
              id="image_url"
              name="image_url"
              placeholder="https://..."
            />
          </div>

          <div class="form-group">
            <label for="project_url">Project URL</label>
            <input
              type="url"
              id="project_url"
              name="project_url"
              placeholder="https://website-client.com"
            />
            <span class="form-help">
              Opsional. Kosongkan jika project tidak memiliki website online.
            </span>
          </div>

          <div id="message" class="message"></div>

          <div class="form-actions">
            <button type="submit" class="btn-primary">Simpan Portfolio</button>

            <button type="reset" class="btn-secondary">Reset</button>
          </div>
        </form>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js?v=2"></script>
  </body>
</html>
