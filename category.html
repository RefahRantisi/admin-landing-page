<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Kategori</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, sans-serif;
        background: #f5f6f8;
        color: #1f2937;
      }
      .admin-container {
        max-width: 900px;
        margin: 50px auto;
        padding: 20px;
      }
      .admin-header {
        margin-bottom: 30px;
      }
      .admin-header h1 {
        font-size: 28px;
        margin-bottom: 8px;
      }
      .admin-header p {
        color: #6b7280;
      }
      .back-link {
        display: inline-block;
        margin-top: 15px;
        color: #2563eb;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
      }
      .back-link:hover {
        text-decoration: underline;
      }
      .card {
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        margin-bottom: 25px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }
      .form-group input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
      }
      .form-group input:focus {
        border-color: #2563eb;
      }
      .form-help {
        display: block;
        margin-top: 6px;
        color: #6b7280;
        font-size: 13px;
      }
      .form-actions {
        display: flex;
        gap: 12px;
        margin-top: 25px;
      }
      button {
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-primary {
        background: #2563eb;
        color: white;
      }
      .btn-primary:hover {
        background: #1d4ed8;
      }
      .btn-secondary {
        background: #e5e7eb;
        color: #374151;
      }
      .message {
        display: none;
        padding: 12px 15px;
        border-radius: 8px;
        margin-bottom: 20px;
      }
      .message.success {
        display: block;
        background: #dcfce7;
        color: #166534;
      }
      .message.error {
        display: block;
        background: #fee2e2;
        color: #991b1b;
      }
      .category-list {
        margin-top: 15px;
      }
      .category-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 14px 16px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        margin-bottom: 10px;
      }
      .category-name {
        font-weight: 600;
      }
      .category-slug {
        color: #6b7280;
        font-size: 13px;
        margin-top: 4px;
      }
      .category-actions {
        display: flex;
        gap: 8px;
      }
      .btn-edit {
        background: #e5e7eb;
        color: #374151;
      }
      .btn-delete {
        background: #fee2e2;
        color: #991b1b;
      }
      @media (max-width: 600px) {
        .admin-container {
          margin: 20px auto;
          padding: 15px;
        }
        .card {
          padding: 20px;
        }
        .form-actions,
        .category-item {
          flex-direction: column;
          align-items: stretch;
        }
        .form-actions button,
        .category-actions button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="admin-container">
      <div class="admin-header">
        <h1 id="pageTitle">Tambah Kategori</h1>
        <p id="pageDescription">
          Kelola kategori yang dapat dipilih pada portfolio.
        </p>
        <a href="admin.html" class="back-link">← Kembali ke Admin Portfolio</a>
      </div>

      <div id="message" class="message"></div>

      <div class="card">
        <form id="categoryForm">
          <div class="form-group">
            <label for="name">Nama Kategori *</label>
            <input
              type="text"
              id="name"
              placeholder="Contoh: UMKM"
              required
            />
          </div>
          <div class="form-group">
            <label for="slug">Slug *</label>
            <input
              type="text"
              id="slug"
              placeholder="umkm"
              required
            />
            <span class="form-help"
              >Slug digunakan sebagai identitas URL/filter kategori.</span
            >
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-primary" id="submitButton">
              Simpan Kategori
            </button>
            <button type="reset" class="btn-secondary" id="resetButton">Reset</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>Daftar Kategori</h2>
        <div id="categoryList" class="category-list">Memuat kategori...</div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="category.js"></script>
  </body>
</html>
